name: Package and publish Rill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rill-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: test -n "$SPARKLE_PRIVATE_KEY"
      - name: Install isolated test dependency
        run: command -v redis-server || brew install redis
      - name: Test
        run: swift test
      - name: Package Universal signed update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/package-release.sh
      - name: Publish release and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw assets/Info.plist)"
          build_number="$(plutil -extract CFBundleVersion raw assets/Info.plist)"
          tag="v$version-$build_number"
          output="build/releases/$tag"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          gh release create "$tag" "$output"/*.zip "$output"/*.sha256 "$output/appcast.xml" \
            --target "$(git rev-parse HEAD)" --title "Rill $version ($build_number)" \
            --notes-file "docs/releases/v$version.md"
          cp "$output/appcast.xml" appcast.xml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appcast.xml
          git commit -m "chore: publish update feed for $tag"
          git push origin HEAD:main
